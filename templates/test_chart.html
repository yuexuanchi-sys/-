<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图表测试</title>
    <style>
        body { font-family: sans-serif; background: #1a1a2e; color: #eee; padding: 20px; }
        .card { background: #16213e; border-radius: 8px; padding: 20px; margin: 10px 0; }
        button { padding: 8px 16px; background: #0f3460; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin: 4px; }
        button:hover { background: #1a4a6e; }
        pre { background: #0a0a1a; padding: 12px; border-radius: 4px; overflow-x: auto; max-height: 400px; overflow-y: auto; }
        .status { padding: 8px 12px; border-radius: 4px; margin: 8px 0; }
        .ok { background: rgba(0,200,100,0.2); border: 1px solid rgba(0,200,100,0.5); }
        .err { background: rgba(200,50,50,0.2); border: 1px solid rgba(200,50,50,0.5); }
    </style>
</head>
<body>
    <h1>API 测试面板</h1>

    <div class="card">
        <h3>快速测试</h3>
        <button onclick="testAPI('/api/health')">健康检查</button>
        <button onclick="testAPI('/api/test-data')">测试数据</button>
        <button onclick="testAPI('/api/chapters')">获取章节</button>
        <button onclick="testAPI('/api/full-graph')">完整图谱</button>
        <button onclick="testAPI('/api/search?q=有理数')">搜索: 有理数</button>
    </div>

    <div class="card">
        <h3>自定义请求</h3>
        <input type="text" id="custom-url" value="/api/health" style="width:400px; padding:8px; background:#0a0a1a; color:#eee; border:1px solid #333; border-radius:4px;">
        <button onclick="testAPI(document.getElementById('custom-url').value)">发送</button>
    </div>

    <div class="card">
        <h3>结果</h3>
        <div id="status"></div>
        <pre id="result">等待请求...</pre>
    </div>

    <script>
    async function testAPI(url) {
        const statusEl = document.getElementById('status');
        const resultEl = document.getElementById('result');
        statusEl.innerHTML = '<div class="status">请求中...</div>';
        resultEl.textContent = '加载中...';

        try {
            const start = Date.now();
            const res = await fetch(url);
            const elapsed = Date.now() - start;
            const data = await res.json();

            statusEl.innerHTML = `<div class="status ok">状态: ${res.status} | 耗时: ${elapsed}ms</div>`;
            resultEl.textContent = JSON.stringify(data, null, 2);
        } catch (e) {
            statusEl.innerHTML = `<div class="status err">请求失败: ${e.message}</div>`;
            resultEl.textContent = e.toString();
        }
    }
    </script>
</body>
</html>
