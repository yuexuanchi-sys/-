<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初中数学知识图谱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0f1923;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1a2332 0%, #0d1b2a 100%);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1e3a5f;
            z-index: 100;
            position: relative;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(90deg, #4fc3f7, #81d4fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-stats {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: #8899aa;
        }
        .header-stats span { color: #4fc3f7; font-weight: 600; }

        /* Layout */
        .main-container {
            display: flex;
            height: calc(100vh - 52px);
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background: #152232;
            border-right: 1px solid #1e3a5f;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Search */
        .search-box {
            padding: 16px;
            border-bottom: 1px solid #1e3a5f;
        }
        .search-input {
            width: 100%;
            padding: 10px 14px;
            background: #0d1b2a;
            border: 1px solid #1e3a5f;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus { border-color: #4fc3f7; }
        .search-input::placeholder { color: #556677; }

        /* Controls */
        .controls {
            padding: 12px 16px;
            border-bottom: 1px solid #1e3a5f;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 6px 14px;
            border: 1px solid #1e3a5f;
            border-radius: 6px;
            background: #1a2d42;
            color: #b0c4d8;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { background: #243b55; border-color: #4fc3f7; color: #fff; }
        .btn.active { background: #1a4a6e; border-color: #4fc3f7; color: #4fc3f7; }
        .btn-primary {
            background: linear-gradient(135deg, #1565c0, #0d47a1);
            border-color: #1976d2;
            color: #fff;
        }
        .btn-primary:hover { background: linear-gradient(135deg, #1976d2, #1565c0); }

        /* Node list */
        .node-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        .node-list::-webkit-scrollbar { width: 6px; }
        .node-list::-webkit-scrollbar-track { background: transparent; }
        .node-list::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 3px; }
        .node-item {
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .node-item:hover { background: #1a2d42; }
        .node-item.selected { background: #1a3a5f; border-left: 3px solid #4fc3f7; }
        .node-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .node-item-name {
            font-size: 13px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .node-item-type {
            font-size: 11px;
            color: #667788;
            padding: 2px 6px;
            background: #0d1b2a;
            border-radius: 4px;
        }

        /* Graph canvas */
        .graph-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        #graph-canvas {
            width: 100%;
            height: 100%;
        }

        /* Info panel */
        .info-panel {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 280px;
            background: rgba(21, 34, 50, 0.95);
            border: 1px solid #1e3a5f;
            border-radius: 12px;
            padding: 20px;
            display: none;
            backdrop-filter: blur(10px);
        }
        .info-panel.visible { display: block; }
        .info-panel h3 {
            font-size: 16px;
            color: #4fc3f7;
            margin-bottom: 12px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 13px;
            border-bottom: 1px solid rgba(30, 58, 95, 0.5);
        }
        .info-row:last-child { border: none; }
        .info-label { color: #667788; }
        .info-value { color: #b0c4d8; }
        .info-relations {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #1e3a5f;
        }
        .info-relations h4 {
            font-size: 13px;
            color: #8899aa;
            margin-bottom: 8px;
        }
        .relation-item {
            font-size: 12px;
            padding: 4px 0;
            color: #b0c4d8;
        }
        .relation-arrow { color: #4fc3f7; margin: 0 4px; }
        .close-info {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 24px;
            height: 24px;
            background: none;
            border: none;
            color: #667788;
            cursor: pointer;
            font-size: 18px;
        }
        .close-info:hover { color: #fff; }

        /* Legend */
        .legend {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: rgba(21, 34, 50, 0.9);
            border: 1px solid #1e3a5f;
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            gap: 16px;
            font-size: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        /* Loading */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 25, 35, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            z-index: 50;
        }
        .loading-overlay.hidden { display: none; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #1e3a5f;
            border-top-color: #4fc3f7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: #8899aa; font-size: 14px; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1a3a5f;
            border: 1px solid #4fc3f7;
            border-radius: 8px;
            padding: 10px 20px;
            color: #e0e0e0;
            font-size: 13px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 200;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* Empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #556677;
            font-size: 14px;
            gap: 8px;
        }
        .empty-state-icon { font-size: 48px; opacity: 0.3; }
    </style>
</head>
<body>
    <div class="header">
        <h1>初中数学知识图谱</h1>
        <div class="header-stats">
            节点: <span id="node-count">0</span>
            &nbsp;&middot;&nbsp;
            关系: <span id="edge-count">0</span>
        </div>
    </div>

    <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="search-box">
                <input type="text" class="search-input" id="search-input"
                       placeholder="搜索知识点..." autocomplete="off">
            </div>
            <div class="controls">
                <button class="btn active" data-level="all" onclick="filterByLevel('all')">全部</button>
                <button class="btn" data-level="root" onclick="filterByLevel('root')">根分类</button>
                <button class="btn" data-level="chapter" onclick="filterByLevel('chapter')">章节</button>
                <button class="btn" data-level="section" onclick="filterByLevel('section')">小节</button>
                <button class="btn" data-level="knowledge" onclick="filterByLevel('knowledge')">知识点</button>
            </div>
            <div class="controls">
                <button class="btn btn-primary" onclick="loadFullGraph()">加载完整图谱</button>
                <button class="btn" onclick="loadMockData()">演示数据</button>
            </div>
            <div class="node-list" id="node-list">
                <div class="empty-state">
                    <div class="empty-state-icon">&#9678;</div>
                    <div>点击"加载完整图谱"或"演示数据"开始</div>
                </div>
            </div>
        </div>

        <!-- Graph -->
        <div class="graph-container">
            <canvas id="graph-canvas"></canvas>
            <div class="loading-overlay hidden" id="loading">
                <div class="spinner"></div>
                <div class="loading-text">正在加载知识图谱...</div>
            </div>

            <!-- Info panel -->
            <div class="info-panel" id="info-panel">
                <button class="close-info" onclick="closeInfoPanel()">&times;</button>
                <h3 id="info-name"></h3>
                <div id="info-details"></div>
                <div class="info-relations" id="info-relations"></div>
            </div>

            <!-- Legend -->
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-dot" style="background:#FF6B6B"></div>根分类
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background:#4ECDC4"></div>章节
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background:#45B7D1"></div>小节
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background:#96CEB4"></div>知识点
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    // ===== State =====
    let graphData = { nodes: [], relationships: [] };
    let filteredNodes = [];
    let selectedNode = null;
    let camera = { x: 0, y: 0, zoom: 1 };
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let dragNode = null;
    let hoveredNode = null;
    const canvas = document.getElementById('graph-canvas');
    const ctx = canvas.getContext('2d');

    // ===== Canvas Setup =====
    function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width * window.devicePixelRatio;
        canvas.height = rect.height * window.devicePixelRatio;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
        render();
    }
    window.addEventListener('resize', resizeCanvas);

    // ===== Data Loading =====
    async function loadFullGraph() {
        showLoading(true);
        try {
            const res = await fetch('/api/full-graph');
            const json = await res.json();
            if (json.success && json.data) {
                setGraphData(json.data);
                showToast('知识图谱加载成功');
            } else {
                // Fallback: try mock data from server
                const mockRes = await fetch('/api/test-data');
                const mockJson = await mockRes.json();
                if (mockJson.success) {
                    showToast('数据库连接成功，共 ' + mockJson.data.total_nodes + ' 个节点');
                    loadMockData();
                } else {
                    showToast('连接失败: ' + (json.error || '未知错误'));
                    loadMockData();
                }
            }
        } catch (e) {
            showToast('无法连接服务器，加载演示数据');
            loadMockData();
        }
        showLoading(false);
    }

    function loadMockData() {
        const mockNodes = [
            { id: '1', label: '初中数学', color: '#FF6B6B', level: 0, properties: { name: '初中数学', grade: '初中' } },
            { id: '2', label: '有理数', color: '#4ECDC4', level: 1, properties: { name: '有理数', chapter: '1' } },
            { id: '3', label: '整式的加减', color: '#4ECDC4', level: 1, properties: { name: '整式的加减', chapter: '2' } },
            { id: '4', label: '一元一次方程', color: '#4ECDC4', level: 1, properties: { name: '一元一次方程', chapter: '3' } },
            { id: '5', label: '几何图形初步', color: '#4ECDC4', level: 1, properties: { name: '几何图形初步', chapter: '4' } },
            { id: '6', label: '正数和负数', color: '#45B7D1', level: 2, properties: { name: '正数和负数', section: '1.1' } },
            { id: '7', label: '有理数的加减', color: '#45B7D1', level: 2, properties: { name: '有理数的加减', section: '1.3' } },
            { id: '8', label: '有理数的乘除', color: '#45B7D1', level: 2, properties: { name: '有理数的乘除', section: '1.4' } },
            { id: '9', label: '单项式与多项式', color: '#45B7D1', level: 2, properties: { name: '单项式与多项式', section: '2.1' } },
            { id: '10', label: '等式的性质', color: '#45B7D1', level: 2, properties: { name: '等式的性质', section: '3.1' } },
            { id: '11', label: '直线、射线、线段', color: '#45B7D1', level: 2, properties: { name: '直线、射线、线段', section: '4.1' } },
            { id: '12', label: '正数的概念', color: '#96CEB4', level: 3, properties: { name: '正数的概念' } },
            { id: '13', label: '负数的概念', color: '#96CEB4', level: 3, properties: { name: '负数的概念' } },
            { id: '14', label: '有理数加法法则', color: '#96CEB4', level: 3, properties: { name: '有理数加法法则' } },
            { id: '15', label: '有理数减法法则', color: '#96CEB4', level: 3, properties: { name: '有理数减法法则' } },
            { id: '16', label: '乘法分配律', color: '#96CEB4', level: 3, properties: { name: '乘法分配律' } },
            { id: '17', label: '移项', color: '#96CEB4', level: 3, properties: { name: '移项' } },
            { id: '18', label: '合并同类项', color: '#96CEB4', level: 3, properties: { name: '合并同类项' } },
            { id: '19', label: '绝对值', color: '#96CEB4', level: 3, properties: { name: '绝对值' } },
            { id: '20', label: '数轴', color: '#96CEB4', level: 3, properties: { name: '数轴' } },
        ];

        const mockEdges = [
            { id: 'e1', source: '1', target: '2', label: '包含' },
            { id: 'e2', source: '1', target: '3', label: '包含' },
            { id: 'e3', source: '1', target: '4', label: '包含' },
            { id: 'e4', source: '1', target: '5', label: '包含' },
            { id: 'e5', source: '2', target: '6', label: '包含' },
            { id: 'e6', source: '2', target: '7', label: '包含' },
            { id: 'e7', source: '2', target: '8', label: '包含' },
            { id: 'e8', source: '3', target: '9', label: '包含' },
            { id: 'e9', source: '4', target: '10', label: '包含' },
            { id: 'e10', source: '5', target: '11', label: '包含' },
            { id: 'e11', source: '6', target: '12', label: '包含' },
            { id: 'e12', source: '6', target: '13', label: '包含' },
            { id: 'e13', source: '7', target: '14', label: '包含' },
            { id: 'e14', source: '7', target: '15', label: '包含' },
            { id: 'e15', source: '8', target: '16', label: '包含' },
            { id: 'e16', source: '10', target: '17', label: '包含' },
            { id: 'e17', source: '9', target: '18', label: '包含' },
            { id: 'e18', source: '6', target: '19', label: '包含' },
            { id: 'e19', source: '6', target: '20', label: '包含' },
            { id: 'e20', source: '14', target: '15', label: '前置知识' },
            { id: 'e21', source: '19', target: '20', label: '相关概念' },
            { id: 'e22', source: '17', target: '18', label: '相关概念' },
        ];

        setGraphData({ nodes: mockNodes, relationships: mockEdges });
        showToast('演示数据已加载');
    }

    function setGraphData(data) {
        graphData = data;

        // 兼容 from/to 和 source/target 两种边格式
        graphData.relationships.forEach(e => {
            if (!e.source && e.from) e.source = e.from;
            if (!e.target && e.to) e.target = e.to;
        });

        // Assign physics positions using force layout
        const W = canvas.width / window.devicePixelRatio;
        const H = canvas.height / window.devicePixelRatio;
        graphData.nodes.forEach((n, i) => {
            const angle = (2 * Math.PI * i) / graphData.nodes.length;
            const radius = 100 + (n.level || 0) * 120;
            n.x = W / 2 + Math.cos(angle) * radius;
            n.y = H / 2 + Math.sin(angle) * radius;
            n.vx = 0;
            n.vy = 0;
            n.radius = n.level === 0 ? 28 : n.level === 1 ? 22 : n.level === 2 ? 18 : 14;
        });

        filteredNodes = [...graphData.nodes];
        runForceLayout();
        updateNodeList();
        updateStats();
        camera = { x: 0, y: 0, zoom: 1 };
    }

    // ===== Force-directed Layout =====
    function runForceLayout() {
        const nodes = graphData.nodes;
        const edges = graphData.relationships;
        const iterations = Math.min(120, Math.max(30, Math.floor(8000 / nodes.length)));

        for (let iter = 0; iter < iterations; iter++) {
            const alpha = 1 - iter / iterations;

            // Repulsion between all nodes
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    let dx = nodes[j].x - nodes[i].x;
                    let dy = nodes[j].y - nodes[i].y;
                    let dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    let force = (800 * alpha) / (dist * dist);
                    let fx = dx / dist * force;
                    let fy = dy / dist * force;
                    nodes[i].vx -= fx;
                    nodes[i].vy -= fy;
                    nodes[j].vx += fx;
                    nodes[j].vy += fy;
                }
            }

            // Attraction along edges
            const nodeMap = {};
            nodes.forEach(n => nodeMap[n.id] = n);
            edges.forEach(e => {
                const s = nodeMap[e.source];
                const t = nodeMap[e.target];
                if (!s || !t) return;
                let dx = t.x - s.x;
                let dy = t.y - s.y;
                let dist = Math.sqrt(dx * dx + dy * dy) || 1;
                let force = (dist - 120) * 0.02 * alpha;
                let fx = dx / dist * force;
                let fy = dy / dist * force;
                s.vx += fx;
                s.vy += fy;
                t.vx -= fx;
                t.vy -= fy;
            });

            // Center gravity
            const W = canvas.width / window.devicePixelRatio;
            const H = canvas.height / window.devicePixelRatio;
            nodes.forEach(n => {
                n.vx += (W / 2 - n.x) * 0.001;
                n.vy += (H / 2 - n.y) * 0.001;
                n.x += n.vx;
                n.y += n.vy;
                n.vx *= 0.85;
                n.vy *= 0.85;
            });
        }
        render();
    }

    // ===== Rendering =====
    function render() {
        const W = canvas.width / window.devicePixelRatio;
        const H = canvas.height / window.devicePixelRatio;
        ctx.clearRect(0, 0, W, H);
        ctx.save();
        ctx.translate(camera.x, camera.y);
        ctx.scale(camera.zoom, camera.zoom);

        const nodeMap = {};
        graphData.nodes.forEach(n => nodeMap[n.id] = n);
        const visibleIds = new Set(filteredNodes.map(n => n.id));

        // Draw edges
        graphData.relationships.forEach(e => {
            const s = nodeMap[e.source];
            const t = nodeMap[e.target];
            if (!s || !t) return;
            if (!visibleIds.has(s.id) && !visibleIds.has(t.id)) return;

            const opacity = (visibleIds.has(s.id) && visibleIds.has(t.id)) ? 0.5 : 0.15;
            ctx.beginPath();
            ctx.moveTo(s.x, s.y);
            ctx.lineTo(t.x, t.y);
            ctx.strokeStyle = `rgba(79, 195, 247, ${opacity})`;
            ctx.lineWidth = 1.2;
            ctx.stroke();

            // Arrow
            const angle = Math.atan2(t.y - s.y, t.x - s.x);
            const tr = t.radius || 14;
            const ax = t.x - Math.cos(angle) * (tr + 4);
            const ay = t.y - Math.sin(angle) * (tr + 4);
            ctx.beginPath();
            ctx.moveTo(ax, ay);
            ctx.lineTo(ax - 8 * Math.cos(angle - 0.3), ay - 8 * Math.sin(angle - 0.3));
            ctx.lineTo(ax - 8 * Math.cos(angle + 0.3), ay - 8 * Math.sin(angle + 0.3));
            ctx.closePath();
            ctx.fillStyle = `rgba(79, 195, 247, ${opacity})`;
            ctx.fill();

            // Edge label
            if (e.label && camera.zoom > 0.6) {
                const mx = (s.x + t.x) / 2;
                const my = (s.y + t.y) / 2;
                ctx.font = '10px sans-serif';
                ctx.fillStyle = `rgba(136, 153, 170, ${opacity + 0.2})`;
                ctx.textAlign = 'center';
                ctx.fillText(e.label, mx, my - 4);
            }
        });

        // Draw nodes
        graphData.nodes.forEach(n => {
            const isVisible = visibleIds.has(n.id);
            const isSelected = selectedNode && selectedNode.id === n.id;
            const isHovered = hoveredNode && hoveredNode.id === n.id;
            const r = n.radius || 14;
            const alpha = isVisible ? 1 : 0.15;

            // Glow for selected
            if (isSelected) {
                ctx.beginPath();
                ctx.arc(n.x, n.y, r + 8, 0, Math.PI * 2);
                const glow = ctx.createRadialGradient(n.x, n.y, r, n.x, n.y, r + 8);
                glow.addColorStop(0, 'rgba(79, 195, 247, 0.4)');
                glow.addColorStop(1, 'rgba(79, 195, 247, 0)');
                ctx.fillStyle = glow;
                ctx.fill();
            }

            // Node circle
            ctx.beginPath();
            ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
            ctx.fillStyle = isHovered ? lightenColor(n.color, 30) : n.color;
            ctx.globalAlpha = alpha;
            ctx.fill();
            if (isSelected || isHovered) {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            ctx.globalAlpha = 1;

            // Label
            if (camera.zoom > 0.4) {
                ctx.font = `${Math.max(10, 12 / camera.zoom * 0.8)}px sans-serif`;
                ctx.fillStyle = alpha < 0.5 ? 'rgba(224, 224, 224, 0.2)' : '#e0e0e0';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const label = n.label.length > 6 ? n.label.slice(0, 6) + '..' : n.label;
                ctx.fillText(label, n.x, n.y + r + 14);
            }
        });

        ctx.restore();
    }

    function lightenColor(hex, amt) {
        let r = parseInt(hex.slice(1, 3), 16);
        let g = parseInt(hex.slice(3, 5), 16);
        let b = parseInt(hex.slice(5, 7), 16);
        r = Math.min(255, r + amt);
        g = Math.min(255, g + amt);
        b = Math.min(255, b + amt);
        return `rgb(${r},${g},${b})`;
    }

    // ===== Interaction =====
    function getNodeAt(mx, my) {
        const x = (mx - camera.x) / camera.zoom;
        const y = (my - camera.y) / camera.zoom;
        for (let i = graphData.nodes.length - 1; i >= 0; i--) {
            const n = graphData.nodes[i];
            const r = n.radius || 14;
            const dx = x - n.x;
            const dy = y - n.y;
            if (dx * dx + dy * dy < (r + 4) * (r + 4)) return n;
        }
        return null;
    }

    canvas.addEventListener('mousedown', e => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const node = getNodeAt(mx, my);
        if (node) {
            dragNode = node;
        } else {
            isDragging = true;
        }
        dragStart = { x: e.clientX, y: e.clientY };
    });

    canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        if (dragNode) {
            dragNode.x += (e.clientX - dragStart.x) / camera.zoom;
            dragNode.y += (e.clientY - dragStart.y) / camera.zoom;
            dragStart = { x: e.clientX, y: e.clientY };
            render();
            return;
        }
        if (isDragging) {
            camera.x += e.clientX - dragStart.x;
            camera.y += e.clientY - dragStart.y;
            dragStart = { x: e.clientX, y: e.clientY };
            render();
            return;
        }

        const node = getNodeAt(mx, my);
        if (node !== hoveredNode) {
            hoveredNode = node;
            canvas.style.cursor = node ? 'pointer' : 'grab';
            render();
        }
    });

    canvas.addEventListener('mouseup', e => {
        if (dragNode && !isDragging) {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            const movedDist = Math.abs(e.clientX - dragStart.x) + Math.abs(e.clientY - dragStart.y);
            // If barely moved, treat as click
            if (movedDist < 5) selectNode(dragNode);
        }
        isDragging = false;
        dragNode = null;
    });

    canvas.addEventListener('wheel', e => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const delta = e.deltaY > 0 ? 0.9 : 1.1;
        const newZoom = Math.max(0.1, Math.min(5, camera.zoom * delta));
        camera.x = mx - (mx - camera.x) * (newZoom / camera.zoom);
        camera.y = my - (my - camera.y) * (newZoom / camera.zoom);
        camera.zoom = newZoom;
        render();
    });

    // ===== Selection & Info =====
    function selectNode(node) {
        selectedNode = node;
        document.querySelectorAll('.node-item').forEach(el => {
            el.classList.toggle('selected', el.dataset.id === node.id);
        });
        showInfoPanel(node);
        render();
    }

    function showInfoPanel(node) {
        const panel = document.getElementById('info-panel');
        document.getElementById('info-name').textContent = node.label;

        const levelNames = { 0: '根分类', 1: '章节', 2: '小节', 3: '知识点' };
        let html = '';
        html += `<div class="info-row"><span class="info-label">类型</span><span class="info-value">${levelNames[node.level] || '未知'}</span></div>`;
        if (node.properties) {
            Object.entries(node.properties).forEach(([k, v]) => {
                if (v && k !== 'name') {
                    html += `<div class="info-row"><span class="info-label">${k}</span><span class="info-value">${v}</span></div>`;
                }
            });
        }
        document.getElementById('info-details').innerHTML = html;

        // Find relations
        const nodeMap = {};
        graphData.nodes.forEach(n => nodeMap[n.id] = n);
        const rels = graphData.relationships.filter(e => e.source === node.id || e.target === node.id);
        let relHtml = '<h4>关联关系 (' + rels.length + ')</h4>';
        rels.slice(0, 10).forEach(e => {
            const other = e.source === node.id ? nodeMap[e.target] : nodeMap[e.source];
            if (other) {
                const arrow = e.source === node.id ? '&rarr;' : '&larr;';
                relHtml += `<div class="relation-item">${e.label} <span class="relation-arrow">${arrow}</span> ${other.label}</div>`;
            }
        });
        if (rels.length > 10) relHtml += `<div class="relation-item" style="color:#556677">...还有 ${rels.length - 10} 个关系</div>`;
        document.getElementById('info-relations').innerHTML = relHtml;

        panel.classList.add('visible');
    }

    function closeInfoPanel() {
        document.getElementById('info-panel').classList.remove('visible');
        selectedNode = null;
        render();
    }

    // ===== Sidebar =====
    function updateNodeList() {
        const list = document.getElementById('node-list');
        if (filteredNodes.length === 0) {
            list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#9678;</div><div>无匹配结果</div></div>';
            return;
        }
        const sorted = [...filteredNodes].sort((a, b) => (a.level || 0) - (b.level || 0));
        list.innerHTML = sorted.map(n => `
            <div class="node-item ${selectedNode && selectedNode.id === n.id ? 'selected' : ''}"
                 data-id="${n.id}" onclick="selectNodeById('${n.id}')">
                <div class="node-dot" style="background:${n.color}"></div>
                <div class="node-item-name">${n.label}</div>
                <div class="node-item-type">${({0:'根',1:'章',2:'节',3:'知识点'})[n.level] || ''}</div>
            </div>
        `).join('');
    }

    function selectNodeById(id) {
        const node = graphData.nodes.find(n => n.id === id);
        if (node) {
            selectNode(node);
            // Center on node
            const W = canvas.width / window.devicePixelRatio;
            const H = canvas.height / window.devicePixelRatio;
            camera.x = W / 2 - node.x * camera.zoom;
            camera.y = H / 2 - node.y * camera.zoom;
            render();
        }
    }

    function updateStats() {
        document.getElementById('node-count').textContent = graphData.nodes.length;
        document.getElementById('edge-count').textContent = graphData.relationships.length;
    }

    // ===== Filtering =====
    function filterByLevel(level) {
        document.querySelectorAll('.controls .btn[data-level]').forEach(b => b.classList.remove('active'));
        document.querySelector(`.btn[data-level="${level}"]`).classList.add('active');

        const levelMap = { root: 0, chapter: 1, section: 2, knowledge: 3 };
        if (level === 'all') {
            filteredNodes = [...graphData.nodes];
        } else {
            filteredNodes = graphData.nodes.filter(n => n.level === levelMap[level]);
        }
        updateNodeList();
        render();
    }

    // Search
    document.getElementById('search-input').addEventListener('input', function() {
        const q = this.value.trim().toLowerCase();
        if (!q) {
            filteredNodes = [...graphData.nodes];
        } else {
            filteredNodes = graphData.nodes.filter(n =>
                n.label.toLowerCase().includes(q) ||
                (n.properties && JSON.stringify(n.properties).toLowerCase().includes(q))
            );
        }
        updateNodeList();
        render();
    });

    // ===== Utilities =====
    function showLoading(show) {
        document.getElementById('loading').classList.toggle('hidden', !show);
    }
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }

    // ===== Init =====
    resizeCanvas();
    </script>
</body>
</html>
